[project]
name = "local-ai-devops-agent"
version = "0.1.0"
description = "Local AI DevOps Engineering Agent"
authors = [
    { name = "Manoj Chavan", email = "manoj@example.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "motor>=3.3.1",
    "chromadb>=0.4.15",
    "ollama>=0.1.0",
    "loguru>=0.7.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0"
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
